<script>
const form=document.getElementById('form');
const input=document.getElementById('password');
const error=document.getElementById('error');
const submit=document.getElementById('submit');
const payload=JSON.parse(document.getElementById('payload').textContent);
function b64bytes(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0));}
async function deriveKey(password){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decrypt(password){
  const key=await deriveKey(password);
  const data=b64bytes(payload.data);
  const tag=b64bytes(payload.tag);
  const combined=new Uint8Array(data.length+tag.length);
  combined.set(data); combined.set(tag,data.length);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(payload.iv)},key,combined);
  return new TextDecoder().decode(plain);
}
form.addEventListener('submit',async event=>{
  event.preventDefault(); error.textContent=''; submit.disabled=true; submit.textContent='Abriendo...';
  try{ const html=await decrypt(input.value.trim()); document.open(); document.write(html); document.close(); }
  catch(e){ input.value=''; input.focus(); error.textContent='Contraseña incorrecta.'; submit.disabled=false; submit.textContent='Entrar'; }
});
</script>
